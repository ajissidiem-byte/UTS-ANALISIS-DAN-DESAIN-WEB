<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Ajis Firdaus</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="form-page">
    <a class="back-link" href="index.html">← Kembali ke halaman awal</a>
    <section class="form-card">
      <div class="form-icon">⌁</div>
      <p class="eyebrow">SELAMAT DATANG KEMBALI</p>
      <h1>Halaman <span>Login</span></h1>
      <p class="form-desc">Masuk untuk melanjutkan ke halaman profil.</p>
      <form action="profil.html" method="get">
        <label for="email">Email atau NIM</label>
        <input id="email" name="email" type="text" placeholder="Masukkan email atau NIM" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Masukkan password" required>
        <button class="btn btn-primary btn-full" type="submit">Login <span>→</span></button>
      </form>
      <p class="switch-text">Belum punya akun? <a href="daftar.html">Daftar sekarang</a></p>
    </section>
    <footer>© 2026 Ajis Firdaus <span>•</span> UTS Analisis dan Desain Web</footer>
  </main>
</body>
</html>
